<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="t1.css">
	<title>Quiz | Ranking</title>
	<style>
		.ranking-list {
			list-style: none;
			padding: 0;
			margin: 30px auto;
			max-width: 500px;
			text-align: left;
		}
		.ranking-list li {
			background: #222;
			margin-bottom: 12px;
			padding: 15px 20px;
			border-radius: 8px;
			display: flex;
			justify-content: space-between;
			align-items: center;
			font-size: 16px;
			border: 1px solid #444;
		}
		.ranking-list li span.score {
			font-weight: bold;
			color: #8bd68b;
			background: rgba(139, 214, 139, 0.2);
			padding: 5px 10px;
			border-radius: 5px;
		}
		.ranking-list li span.name {
			font-weight: bold;
			color: white;
		}
		.ranking-list li.top-1 {
			border-color: #ffd700;
			background: rgba(255, 215, 0, 0.1);
		}
	</style>
</head>
<body>
	<main class="quiz-shell" style="justify-content: center;">
		<section class="quiz-panel" style="text-align: center; padding: 40px;">
			<h1 style="margin-bottom: 10px;">Ranking <span>Geral</span></h1>
			<p style="margin-top: 10px; font-size: 14px; color: #b8e6b8; letter-spacing: 1.5px; font-weight: bold;">OS MELHORES PONTUADORES</p>
			
			<ul class="ranking-list" id="ranking-list"></ul>

			<div style="margin-top: 30px; display: flex; justify-content: center; gap: 20px;">
				<a href="t.html" class="next-button" style="text-decoration: none; display: inline-flex; align-items: center; justify-content: center; font-size: 16px;">Voltar ao Início</a>
				<button class="next-button" id="clear-ranking" style="background: #c44937; border-color: #c44937; font-size: 14px; min-width: auto; padding: 0 15px;">Limpar Ranking</button>
			</div>
		</section>
	</main>
	<script src="ranking.js"></script>
</body>
</html>
